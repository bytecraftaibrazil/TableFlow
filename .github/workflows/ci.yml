name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-2025
    env:
      TABLEFLOW_TEST_SQLSERVER: 'Server=(localdb)\MSSQLLocalDB;Database=master;Integrated Security=True;Encrypt=True;TrustServerCertificate=True'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Start SQL Server LocalDB
        shell: pwsh
        run: |
          $instances = @(sqllocaldb info)
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($instances -notcontains 'MSSQLLocalDB') {
            sqllocaldb create MSSQLLocalDB
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          sqllocaldb start MSSQLLocalDB
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - run: dotnet restore
      - run: dotnet build --no-restore --configuration Release
      - run: dotnet test --no-build --configuration Release --logger "trx;LogFileName=tests.trx"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: tests/**/TestResults/*.trx
